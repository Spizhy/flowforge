name: FlowForge CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend:
    name: Build & Test Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/backend/FlowForge.sln

      - name: Build Solution
        run: dotnet build src/backend/FlowForge.sln --no-restore -c Release

      - name: Run Tests
        run: dotnet test src/backend/FlowForge.sln --no-build -c Release

  frontend:
    name: Build React Workflow UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build
        run: npm run build
